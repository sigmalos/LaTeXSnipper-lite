[package]
name = "latexsnipper"
version = "1.4.1"
description = "Turn screenshots, images, PDFs and handwriting into editable LaTeX"
authors = ["SakuraMathcraft"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.85"

[lib]
name = "latexsnipper_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp", "gif", "tiff"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
# OCR engine and model downloader, shared with the Office add-in host
# (GPU providers per platform are configured there).
mathcraft = { path = "../crates/mathcraft" }
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 3
