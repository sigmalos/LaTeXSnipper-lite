<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>LaTeXSnipper Office</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <img src="./icon.png" alt="" width="48" height="48" />
        <div>
          <h1>LaTeXSnipper Office</h1>
          <p class="intro" data-t="intro"></p>
        </div>
      </header>
      <ul class="status" id="status" aria-live="polite"></ul>
      <progress id="progress" max="1" value="0" hidden></progress>
      <p class="message" id="message" role="status"></p>
      <footer>
        <button class="btn quiet" type="button" id="help" data-t="help"></button>
        <span class="grow"></span>
        <button class="btn danger" type="button" id="uninstall" data-t="uninstall"></button>
        <button class="btn primary" type="button" id="install" data-t="install"></button>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
