[package]
name = "latexsnipper-office"
version = "1.1.0"
description = "LaTeXSnipper Office for Mac: install and manage the Word / PowerPoint add-in"
authors = ["SakuraMathcraft"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.85"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
