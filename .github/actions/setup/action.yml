name: Set up toolchains
description: Node with npm cache, the pinned Rust toolchain with a build cache, and Linux system libraries.
inputs:
  cache-key:
    description: Extra key for the Rust build cache (debug and release builds differ)
    default: debug
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Rust toolchain (pinned in rust-toolchain.toml)
      shell: bash
      run: |
        channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
        rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt --no-self-update
        rustc --version

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: backend -> target
        key: ${{ inputs.cache-key }}

    - name: Linux system libraries
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -yq --no-install-recommends \
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
          libxdo-dev patchelf xvfb
