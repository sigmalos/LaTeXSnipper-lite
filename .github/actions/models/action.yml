name: MathCraft models
description: >
  Restore the MathCraft models from the cache, or download them with the
  app's own downloader (which verifies every file's SHA-256). Exports
  LATEXSNIPPER_MODELS for the real-model tests and smoke tests.
runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache@v6
      with:
        path: .ci-models
        key: mathcraft-models-v2-${{ hashFiles('crates/mathcraft/resources/models.json') }}
        enableCrossOsArchive: true

    - name: Download models
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        # The app's four Int8/text models, plus the FP32 formula models the engine
        # parity test (and the Office add-in) still use.
        for id in mathcraft-formula-det-int8 mathcraft-formula-rec-int8 mathcraft-text-det mathcraft-text-rec mathcraft-formula-det mathcraft-formula-rec; do
          cargo run --quiet --manifest-path backend/Cargo.toml --example download -- .ci-models "$id" | tail -1
        done

    - shell: bash
      run: echo "LATEXSNIPPER_MODELS=${{ github.workspace }}/.ci-models/MathCraft/models" >> "$GITHUB_ENV"
