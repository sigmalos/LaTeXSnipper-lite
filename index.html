<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LaTeXSnipper</title>
    <link rel="stylesheet" href="/frontend/styles.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <symbol id="i-capture" viewBox="0 0 20 20"><path d="M3 7V4.5A1.5 1.5 0 0 1 4.5 3H7M13 3h2.5A1.5 1.5 0 0 1 17 4.5V7M17 13v2.5a1.5 1.5 0 0 1-1.5 1.5H13M7 17H4.5A1.5 1.5 0 0 1 3 15.5V13"/><path d="M7.5 12.5 10 7l2.5 5.5M8.4 10.6h3.2"/></symbol>
        <symbol id="i-help" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/><path d="M8 8a2 2 0 1 1 2.8 1.8c-.5.3-.8.7-.8 1.2v.5M10 14h.01"/></symbol>
        <symbol id="i-image" viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="12" rx="1.5"/><circle cx="7.5" cy="8.5" r="1.3"/><path d="m3.5 14 4-4 3 3 2-2 4 3.5"/></symbol>
        <symbol id="i-pdf" viewBox="0 0 20 20"><path d="M5 2.5h6.5L15 6v11.5H5z"/><path d="M11.5 2.5V6H15M7.5 10h5M7.5 13h5"/></symbol>
        <symbol id="i-pen" viewBox="0 0 20 20"><path d="M13.5 3.5 16.5 6.5 7 16H4v-3z"/><path d="m11.5 5.5 3 3"/></symbol>
        <symbol id="i-copy" viewBox="0 0 20 20"><rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M13 7V4.5A1.5 1.5 0 0 0 11.5 3h-7A1.5 1.5 0 0 0 3 4.5v7A1.5 1.5 0 0 0 4.5 13H7"/></symbol>
        <symbol id="i-export" viewBox="0 0 20 20"><path d="M10 12.5V3M6.5 6.5 10 3l3.5 3.5M4 11v4.5A1.5 1.5 0 0 0 5.5 17h9a1.5 1.5 0 0 0 1.5-1.5V11"/></symbol>
        <symbol id="i-erase" viewBox="0 0 20 20"><path d="m8.5 16.5-4.3-4.3a1.5 1.5 0 0 1 0-2.1L10 4.3a1.5 1.5 0 0 1 2.1 0l3.6 3.6a1.5 1.5 0 0 1 0 2.1l-6.5 6.5H16"/><path d="m7 7.5 5.5 5.5"/></symbol>
        <symbol id="i-trash" viewBox="0 0 20 20"><path d="M3.5 5.5h13M8 5.5V3.5h4v2M5 5.5l.8 11h8.4l.8-11"/></symbol>
        <symbol id="i-key" viewBox="0 0 20 20"><rect x="2.5" y="5" width="15" height="10" rx="1.5"/><path d="M5.5 8h1M8.5 8h1M11.5 8h1M14.5 8h0M6.5 12h7"/></symbol>
        <symbol id="i-star" viewBox="0 0 20 20"><path d="m10 3 2.1 4.4 4.8.6-3.5 3.3.9 4.7L10 13.7 5.7 16l.9-4.7L3.1 8l4.8-.6z"/></symbol>
        <symbol id="i-gear" viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.5"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></symbol>
        <symbol id="i-more" viewBox="0 0 20 20"><circle cx="5" cy="10" r=".9"/><circle cx="10" cy="10" r=".9"/><circle cx="15" cy="10" r=".9"/></symbol>
        <symbol id="i-sort" viewBox="0 0 20 20"><path d="M6 4v12M3 13l3 3 3-3M14 16V4M11 7l3-3 3 3"/></symbol>
      </defs>
    </svg>

    <div class="titlebar" data-tauri-drag-region></div>

    <main class="app" id="app">
      <aside class="side">
        <div class="capture-row">
          <button class="btn primary capture" id="capture-btn" type="button">
            <svg class="ico"><use href="#i-capture" /></svg>
            <span data-i18n="截图识别">截图识别</span>
            <kbd id="capture-kbd"></kbd>
          </button>
          <button class="btn icon-only" id="onboarding-btn" type="button" data-i18n-title="快速入门" title="快速入门">
            <svg class="ico"><use href="#i-help" /></svg>
          </button>
        </div>

        <div class="side-head">
          <h2 data-i18n="历史记录">历史记录</h2>
          <button class="btn quiet small" id="order-btn" type="button">
            <svg class="ico"><use href="#i-sort" /></svg><span id="order-label"></span>
          </button>
        </div>
        <ol class="history" id="history" aria-live="polite"></ol>

        <div class="side-tools">
          <button class="btn quiet" id="clear-history-btn" type="button"><svg class="ico"><use href="#i-trash" /></svg><span data-i18n="清空">清空</span></button>
          <button class="btn quiet" id="hotkey-btn" type="button"><svg class="ico"><use href="#i-key" /></svg><span data-i18n="快捷键">快捷键</span></button>
          <button class="btn quiet" id="favorites-btn" type="button"><svg class="ico"><use href="#i-star" /></svg><span data-i18n="收藏夹">收藏夹</span></button>
          <button class="btn quiet" id="settings-btn" type="button"><svg class="ico"><use href="#i-gear" /></svg><span data-i18n="设置">设置</span></button>
        </div>
        <p class="status" id="status"></p>
      </aside>

      <section class="work">
        <header class="work-head">
          <h1 data-i18n="LaTeX 编辑器">LaTeX 编辑器</h1>
          <div class="toolbar">
            <button class="btn" id="image-btn" type="button"><svg class="ico"><use href="#i-image" /></svg><span data-i18n="图片识别">图片识别</span></button>
            <button class="btn" id="pdf-btn" type="button"><svg class="ico"><use href="#i-pdf" /></svg><span data-i18n="PDF 识别">PDF 识别</span></button>
            <button class="btn" id="handwriting-btn" type="button"><svg class="ico"><use href="#i-pen" /></svg><span data-i18n="手写识别">手写识别</span></button>
            <button class="btn" id="copy-btn" type="button"><svg class="ico"><use href="#i-copy" /></svg><span data-i18n="复制">复制</span></button>
            <div class="menu-anchor">
              <button class="btn" id="export-btn" type="button" aria-haspopup="menu"><svg class="ico"><use href="#i-export" /></svg><span data-i18n="导出">导出</span></button>
              <div class="menu" id="export-menu" role="menu" hidden></div>
            </div>
          </div>
        </header>
        <textarea id="editor" class="editor" spellcheck="false" autocomplete="off" data-i18n-placeholder="在此输入 LaTeX 公式，下方将实时渲染..."></textarea>
        <div class="preview-head">
          <h2 data-i18n="实时渲染预览">实时渲染预览</h2>
          <button class="btn quiet small" id="clear-preview-btn" type="button"><svg class="ico"><use href="#i-erase" /></svg><span data-i18n="清空预览">清空预览</span></button>
        </div>
        <div class="paper" id="preview-paper">
          <div class="preview" id="preview"></div>
          <p class="preview-error" id="preview-error" hidden></p>
        </div>
      </section>
      <div class="drop-veil" id="drop-veil" hidden><span data-i18n="拖到这里识别">拖到这里识别</span></div>
    </main>

    <input type="file" id="image-input" accept="image/png,image/jpeg,image/bmp,image/webp,image/gif,image/tiff" hidden />
    <input type="file" id="pdf-input" accept="application/pdf,.pdf" hidden />

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
    <div class="menu floating" id="item-menu" role="menu" hidden></div>

    <!-- result -->
    <dialog id="result-dialog" class="sheet">
      <form method="dialog">
        <h3 data-i18n="识别结果">识别结果</h3>
        <p class="hint" id="result-hint" data-i18n="确认或修改结果：">确认或修改结果：</p>
        <textarea id="result-text" class="editor compact" spellcheck="false"></textarea>
        <div class="paper small"><div class="preview" id="result-preview"></div></div>
        <p class="warn" id="result-warn" hidden></p>
        <footer>
          <button class="btn quiet" value="cancel" data-i18n="取消">取消</button>
          <button class="btn primary" value="confirm" id="result-confirm" data-i18n="确认并复制">确认并复制</button>
        </footer>
      </form>
    </dialog>

    <!-- models -->
    <dialog id="models-dialog" class="sheet narrow">
      <form method="dialog">
        <h3 data-i18n="下载模型">下载模型</h3>
        <p id="models-text"></p>
        <progress id="models-progress" max="1" value="0" hidden></progress>
        <p class="hint" id="models-status"></p>
        <footer>
          <button class="btn quiet" value="cancel" id="models-cancel" data-i18n="取消">取消</button>
          <button class="btn primary" type="button" id="models-start" data-i18n="开始下载">开始下载</button>
        </footer>
      </form>
    </dialog>

    <!-- settings -->
    <dialog id="settings-dialog" class="sheet">
      <form method="dialog" id="settings-form">
        <h3 data-i18n="设置">设置</h3>
        <fieldset>
          <legend data-i18n="识别类型">识别类型</legend>
          <div class="segmented" role="radiogroup">
            <label><input type="radio" name="mode" value="formula" /><span data-i18n="公式">公式</span></label>
            <label><input type="radio" name="mode" value="mixed" /><span data-i18n="混合">混合</span></label>
            <label><input type="radio" name="mode" value="text" /><span data-i18n="纯文字">纯文字</span></label>
          </div>
        </fieldset>
        <fieldset>
          <legend data-i18n="识别后端">识别后端</legend>
          <label class="radio"><input type="radio" name="backend" value="builtin" /><span data-i18n="内置 MathCraft（离线）">内置 MathCraft（离线）</span></label>
          <div class="models-panel" id="builtin-fields">
            <div class="models-head"><span data-i18n="MathCraft 模型">MathCraft 模型</span><span id="models-count"></span></div>
            <ul class="model-list" id="model-list"></ul>
          </div>
          <label class="radio"><input type="radio" name="backend" value="external" /><span data-i18n="外部模型（OpenAI 兼容接口）">外部模型（OpenAI 兼容接口）</span></label>
          <div class="external" id="external-fields">
            <label><span data-i18n="接口地址">接口地址</span><input name="external_base_url" type="url" placeholder="http://localhost:11434/v1" /></label>
            <label><span data-i18n="模型名称">模型名称</span><input name="external_model" placeholder="qwen2.5vl:7b" /></label>
            <label><span data-i18n="API Key（本地保存，仅当前用户可读）">API Key</span><input name="external_api_key" type="password" autocomplete="off" /></label>
            <label><span data-i18n="超时（秒）">超时（秒）</span><input name="external_timeout_sec" type="number" min="1" max="600" /></label>
            <label class="wide"><span data-i18n="自定义提示词（留空使用内置模板）">自定义提示词</span><textarea name="external_custom_prompt" rows="2"></textarea></label>
            <div class="row"><button class="btn small" type="button" id="test-external" data-i18n="测试连接">测试连接</button><span class="hint" id="test-result"></span></div>
          </div>
        </fieldset>
        <div class="grid2">
          <div class="field" role="radiogroup" aria-labelledby="theme-caption"><span id="theme-caption" data-i18n="外观主题">外观主题</span>
            <div class="segmented">
              <label><input type="radio" name="theme" value="auto" /><span data-i18n="跟随系统">跟随系统</span></label>
              <label><input type="radio" name="theme" value="light" /><span data-i18n="浅色">浅色</span></label>
              <label><input type="radio" name="theme" value="dark" /><span data-i18n="深色">深色</span></label>
            </div>
          </div>
          <label><span data-i18n="界面语言">界面语言</span>
            <select name="language"><option value="zh">简体中文</option><option value="en">English</option></select>
          </label>
          <label><span data-i18n="PDF 渲染分辨率">PDF 渲染分辨率</span><input name="pdf_dpi" type="number" min="72" max="600" step="1" /></label>
          <label><span data-i18n="数据目录">数据目录</span><input id="data-dir" readonly tabindex="-1" /></label>
        </div>
        <footer>
          <span class="hint version" id="version"></span>
          <button class="btn quiet" value="cancel" data-i18n="取消">取消</button>
          <button class="btn primary" value="save" data-i18n="保存">保存</button>
        </footer>
      </form>
    </dialog>

    <!-- hotkey -->
    <dialog id="hotkey-dialog" class="sheet narrow">
      <form method="dialog">
        <h3 data-i18n="全局截图快捷键">全局截图快捷键</h3>
        <button class="keycap" type="button" id="hotkey-capture"></button>
        <p class="hint" id="hotkey-hint" data-i18n="按下新的组合键…">按下新的组合键…</p>
        <footer>
          <button class="btn quiet" type="button" id="hotkey-reset" data-i18n="恢复默认">恢复默认</button>
          <button class="btn quiet" value="cancel" data-i18n="取消">取消</button>
          <button class="btn primary" value="save" id="hotkey-save" data-i18n="保存">保存</button>
        </footer>
      </form>
    </dialog>

    <!-- favorites -->
    <dialog id="favorites-dialog" class="sheet">
      <form method="dialog">
        <h3 data-i18n="收藏夹">收藏夹</h3>
        <ol class="history in-dialog" id="favorites"></ol>
        <footer>
          <button class="btn quiet" type="button" id="favorites-clear"><svg class="ico"><use href="#i-trash" /></svg><span data-i18n="清空全部">清空全部</span></button>
          <button class="btn quiet" type="button" id="favorites-export"><svg class="ico"><use href="#i-export" /></svg><span data-i18n="导出">导出</span></button>
          <button class="btn primary" value="close" data-i18n="关闭">关闭</button>
        </footer>
      </form>
    </dialog>

    <!-- handwriting -->
    <dialog id="hand-dialog" class="sheet wide">
      <form method="dialog">
        <h3 data-i18n="手写识别">手写识别</h3>
        <div class="hand-tools">
          <div class="segmented">
            <label><input type="radio" name="tool" value="pen" checked /><span data-i18n="书写">书写</span></label>
            <label><input type="radio" name="tool" value="eraser" /><span data-i18n="橡皮">橡皮</span></label>
          </div>
          <button class="btn quiet small" type="button" id="hand-undo" data-i18n="撤销">撤销</button>
          <button class="btn quiet small" type="button" id="hand-clear" data-i18n="清空画布">清空画布</button>
          <span class="hint" id="hand-status"></span>
        </div>
        <div class="hand-split">
          <div class="paper canvas-paper"><canvas id="hand-canvas"></canvas><p class="canvas-hint" id="hand-hint" data-i18n="在此书写，停笔后自动识别">在此书写，停笔后自动识别</p></div>
          <div class="hand-result">
            <textarea id="hand-text" class="editor compact" spellcheck="false"></textarea>
            <div class="paper small"><div class="preview" id="hand-preview"></div></div>
          </div>
        </div>
        <footer>
          <button class="btn quiet" type="button" id="hand-copy" data-i18n="复制">复制</button>
          <button class="btn quiet" value="close" data-i18n="关闭">关闭</button>
          <button class="btn primary" type="button" id="hand-insert" data-i18n="插入编辑器">插入编辑器</button>
        </footer>
      </form>
    </dialog>

    <!-- pdf -->
    <dialog id="pdf-dialog" class="sheet">
      <form method="dialog">
        <h3 id="pdf-title" data-i18n="PDF 选项">PDF 选项</h3>
        <div id="pdf-options">
          <p class="hint" id="pdf-pages"></p>
          <div class="grid2">
            <label><span data-i18n="页码范围（如 1-3,5，留空为全部）">页码范围</span><input id="pdf-range" placeholder="1-3,5" /></label>
            <label><span data-i18n="PDF 渲染分辨率">PDF 渲染分辨率</span><input id="pdf-dpi" type="number" min="72" max="600" step="1" /><small class="hint" data-i18n="清晰文档 150–200，扫描件 300">清晰文档 150–200，扫描件 300</small></label>
          </div>
        </div>
        <div id="pdf-run" hidden>
          <progress id="pdf-progress" max="1" value="0"></progress>
          <p class="hint" id="pdf-status"></p>
          <textarea id="pdf-text" class="editor tall" spellcheck="false"></textarea>
        </div>
        <footer>
          <button class="btn quiet" value="cancel" id="pdf-cancel" data-i18n="取消">取消</button>
          <button class="btn quiet" type="button" id="pdf-export" hidden data-i18n="导出">导出</button>
          <button class="btn primary" type="button" id="pdf-start" data-i18n="开始识别">开始识别</button>
          <button class="btn primary" type="button" id="pdf-insert" hidden data-i18n="插入编辑器">插入编辑器</button>
        </footer>
      </form>
    </dialog>

    <!-- onboarding -->
    <dialog id="onboarding-dialog" class="sheet narrow">
      <form method="dialog">
        <ol class="steps" id="onboarding-steps"></ol>
        <footer>
          <span class="dots" id="onboarding-dots"></span>
          <button class="btn quiet" type="button" id="onboarding-back" data-i18n="上一步">上一步</button>
          <button class="btn primary" type="button" id="onboarding-next" data-i18n="下一步">下一步</button>
        </footer>
      </form>
    </dialog>

    <!-- prompt / confirm -->
    <dialog id="ask-dialog" class="sheet narrow">
      <form method="dialog">
        <p id="ask-text"></p>
        <input id="ask-input" />
        <footer>
          <button class="btn quiet" value="cancel" data-i18n="取消">取消</button>
          <button class="btn primary" value="ok" id="ask-ok"></button>
        </footer>
      </form>
    </dialog>

    <script type="module" src="/frontend/main.ts"></script>
  </body>
</html>
